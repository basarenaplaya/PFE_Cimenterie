# Production stack for factory-edge hosts (e.g. Raspberry Pi 4, 2GB RAM).
# Single config: copy `.env.example` to `.env` in this directory before `docker compose up`.
#
# Published ports: 80 (dashboard + proxied /api and /socket.io), 3000 (direct API/WebSocket).
# MariaDB is reachable only on the internal bridge network (3306 not published).
# Backend also reads repo-root `.env` via `env_file`; values below override DB + listen for Docker only.

services:
  db:
    image: mariadb:10.5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=50
      - --innodb_buffer_pool_size=256M
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./pfe-backend/db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

  backend:
    build:
      context: ./pfe-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      BIND_HOST: 0.0.0.0
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build:
      context: ./pfe-dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  mariadb_data:

